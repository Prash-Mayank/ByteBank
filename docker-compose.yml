version: "3.9"

services:
  bytebank-app:
    build: .
    container_name: bytebank-app
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_BASE_URL: http://bytebank-ai:11434
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      bytebank-db:
        condition: service_healthy
      bytebank-ai:
        condition: service_started
    networks:
      - bytebank-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bytebank-db:
    image: mysql:8.0
    container_name: bytebank-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: bytebank
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bytebank-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bytebank-ai:
    image: ollama/ollama
    container_name: bytebank-ai
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - bytebank-net
    # First-run entrypoint override pulls the model, then serves
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && wait"]

  bytebank-nginx:
    image: nginx:alpine
    container_name: bytebank-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bytebank-app
    networks:
      - bytebank-net

networks:
  bytebank-net:
    driver: bridge

volumes:
  mysql-data:
  ollama-models:
